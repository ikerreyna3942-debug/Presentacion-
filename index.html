<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F6F3;
            --card-bg: #FFFFFF;
            --text-dark: #1A1C1E;
            --text-muted: #6C6E72;
            --accent-gold: #B8893E;
            --border: #E3DFD7;
            --border-hover: #C5BFB3;
            --chip-bg: #EFECE6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
        }
        header {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .brand-box h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-dark);
        }
        .brand-box span {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .search-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            max-width: 550px;
            margin: 0 20px;
        }
        .search-box {
            flex: 1;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent-gold);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(184, 137, 62, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        .btn-presentation {
            background: var(--text-dark);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-presentation:hover {
            background: var(--accent-gold);
            transform: translateY(-1px);
        }
        .category-bar {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border);
            padding: 12px 32px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cat-btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .cat-btn:hover {
            background: var(--chip-bg);
            color: var(--text-dark);
        }
        .cat-btn.active {
            background: var(--text-dark);
            color: #FFFFFF;
        }
        main {
            max-width: 1600px;
            margin: 32px auto;
            padding: 0 32px;
        }
        .grid-header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .count-text {
            font-size: 14px;
            color: var(--text-muted);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 16px 32px rgba(0,0,0,0.06);
        }
        .img-wrap {
            height: 280px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }
        .product-card:hover .img-wrap img {
            transform: scale(1.03);
        }
        .badge-cat {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .card-col {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .dims-table {
            background: var(--bg);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }
        .dim-item span {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .dim-item strong {
            font-size: 13px;
            color: var(--text-dark);
        }
        .materials-text {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-top: auto;
            border-top: 1px dashed var(--border);
            padding-top: 10px;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20, 22, 25, 0.95);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .modal.active { display: flex; }
        .slide-frame {
            background: var(--bg);
            border-radius: 16px;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
            position: relative;
        }
        .modal-left {
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-right: 1px solid var(--border);
        }
        .modal-left img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .modal-right {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }
        .modal-cat {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .modal-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 20px;
            line-height: 1.15;
            text-transform: uppercase;
        }
        .modal-specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .modal-spec-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
        }
        .modal-spec-card span {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .modal-spec-card strong {
            font-size: 15px;
            color: var(--text-dark);
        }
        .modal-materials {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
        }

            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .modal-materials p {
            font-size: 13px;
            color: var(--text-dark);
            line-height: 1.4;
        }
        .modal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .btn-nav {
            background: var(--text-dark);
            color: #FFFFFF;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;

        .btn-nav:hover {

        }
        .close-btn {

            top: 20px;
            right: 24px;
            background: transparent;
            border: none;
            font-size: 28px;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover { color: var(--text-dark); }
        .nav-counter {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

</head>

        let filteredProducts = [...products];
        let currentIndex = 0;

        function renderGrid(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            document.getElementById('productCount').innerText = `${items.length} muebles disponibles`;
            
            items.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(index);
                card.innerHTML = `
                    <div class="img-wrap">
                        <span class="badge-cat">${p.collection}</span>
                        <img src="${p.photo}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x300?text=CREATA+Muebles'">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-col">${p.category} · REF: ${p.id}</div>
                        
                        <div class="dims-table">
                            <div class="dim-item">
                                <span>Ancho</span>
                                <strong>${p.width !== 'N/D' ? p.width : '-'}</strong>
                            </div>
                            <div class="dim-item">
                                <span>Fondo</span>
                                <strong>${p.depth !== 'N/D' ? p.depth : '-'}</strong>
                            </div>
                            <div class="dim-item">
                                <span>Alto</span>
                                <strong>${p.height !== 'N/D' ? p.height : '-'}</strong>
                            </div>
                        </div>

                        <div class="materials-text">
                            <strong>Acabado:</strong> ${p.materials}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'TODOS' && btn.innerText.includes('TODOS')));
            });
            
            document.getElementById('activeCategoryTitle').innerText = cat === 'TODOS' ? 'Todos los Muebles' : cat;

            if (cat === 'TODOS') {
                filteredProducts = [...products];
            } else {
                filteredProducts = products.filter(p => p.category === cat);
            }
            renderGrid(filteredProducts);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            filteredProducts = products.filter(p => 
                p.name.toLowerCase().includes(term) ||
                p.materials.toLowerCase().includes(term) ||
                p.category.toLowerCase().includes(term) ||
                p.collection.toLowerCase().includes(term)
            );
            renderGrid(filteredProducts);
        });

        function openModal(index) {
            currentIndex = index;
            const p = filteredProducts[currentIndex];
            if (!p) return;

            document.getElementById('modalImg').src = p.photo;
            document.getElementById('modalCat').innerText = `${p.category} · LÍNEA ${p.collection}`;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalWidth').innerText = p.width;
            document.getElementById('modalDepth').innerText = p.depth;
            document.getElementById('modalHeight').innerText = p.height;
            document.getElementById('modalSeat').innerText = p.seat;
            document.getElementById('modalPackages').innerText = p.packages;
            document.getElementById('modalVolume').innerText = p.volume;
            document.getElementById('modalMaterials').innerText = p.materials;
            document.getElementById('modalPrice').innerText = p.price || '$ Consultar';
            document.getElementById('modalCost').innerText = p.cost || '$ Consultar';
            document.getElementById('modalCounter').innerText = `${currentIndex + 1} de ${filteredProducts.length}`;

            document.getElementById('slideModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slideModal').classList.remove('active');
        }

        function prevSlide() {
            if (currentIndex > 0) openModal(currentIndex - 1);
            else openModal(filteredProducts.length - 1);
        }

        function nextSlide() {
            if (currentIndex < filteredProducts.length - 1) openModal(currentIndex + 1);
            else openModal(0);
        }

        function startPresentation() {
            openModal(0);
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('slideModal');
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevSlide();
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            }
        });

        renderGrid(products);
    </script>
</body>
</html>
